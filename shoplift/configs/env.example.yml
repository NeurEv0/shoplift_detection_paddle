# Copy this file to a local env.yml and replace placeholder paths with local
# model weights, sample videos, and output directories. Keep large artifacts
# outside git.
project:
  name: shoplift-detection-paddle
  camera_id: demo-camera-001
  device: cpu

paths:
  paddledetection_root: ./src/PaddleDetection-release-2.9
  model_root: ./models
  sample_video: ./data/samples/demo.mp4
  sample_frame_dir: ./data/samples/frames
  output_dir: ./outputs/shoplift
  cache_dir: ./outputs/cache

models:
  person_mot:
    config: ./src/PaddleDetection-release-2.9/deploy/pipeline/config/infer_cfg_pphuman.yml
    weights_dir: ./models/paddledetection/person_mot
  keypoint:
    weights_dir: ./models/paddledetection/person_keypoint
  item_container:
    config: ./shoplift/configs/item_container.example.yml
    weights_dir: ./models/shoplift/item_container

runtime:
  use_gpu: false
  gpu_id: 0
  frame_stride: 1
  max_frames: null
  save_debug_visualization: true
