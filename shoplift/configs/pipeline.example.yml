camera_id: demo-camera-001

input:
  type: video
  path: ./data/samples/demo.mp4

runtime:
  device: cpu
  frame_stride: 1
  max_frames: null

backend:
  # Use "paddledet_pphuman" after configuring local exported model dirs below.
  # The default keeps CPU-only tests and dry runs independent from model weights.
  type: model_free
  paddledetection_root: ./src/PaddleDetection-release-2.9
  pphuman_config: ./src/PaddleDetection-release-2.9/deploy/pipeline/config/infer_cfg_pphuman.yml
  device: cpu
  run_mode: paddle
  mot:
    enabled: true
    model_dir: ./models/paddledetection/person_mot
    tracker_config: ./src/PaddleDetection-release-2.9/deploy/pipeline/config/tracker_config.yml
    threshold: 0.5
    batch_size: 1
    skip_frame_num: -1
  keypoint:
    enabled: false
    model_dir: ./models/paddledetection/person_keypoint
    threshold: 0.2
    batch_size: 8
    derive_hand_regions: false
  person_attribute:
    enabled: false
    model_dir: ./models/shoplift/person_attribute
    threshold: 0.5
    batch_size: 8
    image_width: 192
    image_height: 256
    min_holding_product_score: 0.5
  item_container:
    enabled: false
    model_dir: ./models/shoplift/item_container
    threshold: 0.35
    batch_size: 1

modules:
  person_gate:
    enabled: true
    min_score: 0.45
    skip_when_empty: true
  pose_recognition:
    enabled: true
    min_keypoint_score: 0.2
  pose_hand:
    enabled: false
    min_keypoint_score: 0.2
  person_attribute:
    enabled: true
    min_holding_product_score: 0.5
  proxy_item:
    enabled: true
  item_container:
    enabled: true
    min_score: 0.35
    classes:
      - item
      - product
      - bag
      - backpack
      - handbag
      - basket
      - cart
      - stroller
      - helmet
      - clothing_region
      - pocket_region

outputs:
  frame_jsonl: shoplift/frame_results.jsonl
  event_json: shoplift/events.json
  debug_visualization_dir: shoplift/debug
  debug_visualization_video: shoplift/debug_visualization.mp4
