camera_id: test-video

input:
  type: video_dir
  path: ./datasets/test_videos

runtime:
  device: cpu
  frame_stride: 30
  max_frames: null
  save_debug_visualization: true
  save_debug_frames: true

backend:
  type: paddledet_pphuman
  paddledetection_root: ./src/PaddleDetection-release-2.9
  pphuman_config: ./src/PaddleDetection-release-2.9/deploy/pipeline/config/infer_cfg_pphuman.yml
  device: cpu
  run_mode: paddle
  output_dir: ./outputs/paddledet/test_videos
  mot:
    enabled: true
    model_dir: C:/shoplift_models/paddledetection/person_mot
    tracker_config: ./src/PaddleDetection-release-2.9/deploy/pipeline/config/tracker_config.yml
    threshold: 0.5
    batch_size: 1
    skip_frame_num: -1
  keypoint:
    enabled: true
    model_dir: C:/shoplift_models/paddledetection/person_keypoint
    threshold: 0.2
    batch_size: 8
    derive_hand_regions: true
  item_container:
    enabled: false
    model_dir: C:/shoplift_models/shoplift/item_container
    threshold: 0.35
    batch_size: 1

modules:
  person_gate:
    enabled: true
    min_score: 0.45
    skip_when_empty: true
  pose_recognition:
    enabled: true
    min_keypoint_score: 0.2
  pose_hand:
    enabled: true
    min_keypoint_score: 0.2
  item_container:
    enabled: false
    min_score: 0.35
    classes:
      - item
      - product
      - bag
      - backpack
      - handbag
      - basket
      - cart
      - stroller
      - helmet
      - clothing_region
      - pocket_region

outputs:
  frame_jsonl: ./outputs/inference_visualization/test_videos/frame_results.jsonl
  event_json: ./outputs/inference_visualization/test_videos/events.json
  debug_visualization_dir: ./outputs/inference_visualization/test_videos/debug_frames
  debug_visualization_video: ./outputs/inference_visualization/test_videos/debug_visualization.mp4
