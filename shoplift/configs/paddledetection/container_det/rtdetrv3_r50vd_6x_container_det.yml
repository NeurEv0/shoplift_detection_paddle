_BASE_: [
  'container_det_detection.yml',
  '../../../../src/PaddleDetection-release-2.9/configs/runtime.yml',
  '../../../../src/PaddleDetection-release-2.9/configs/rtdetrv3/_base_/optimizer_6x.yml',
  '../../../../src/PaddleDetection-release-2.9/configs/rtdetrv3/_base_/rtdetrv3_r50vd.yml',
  '../../../../src/PaddleDetection-release-2.9/configs/rtdetrv3/_base_/rtdetr_reader.yml',
]

# Project-side container detection, RT-DETRv3-R50vd:
# COCO-trained RT-DETRv3-R50vd weights -> supermarket container fine-tuning.
# NOTE: RT-DETRv3 official default pretrains from SSLD backbone only; we fine-tune
# from the full COCO detector weights instead (same approach as the RT-DETR-R50vd baseline).
pretrain_weights: https://paddledet.bj.bcebos.com/models/rtdetrv3_r50vd_6x_coco.pdparams
weights: ../../outputs/wqh/container_det/rtdetrv3_r50vd_6x_container_det/model_final
save_dir: ../../outputs/wqh/container_det/rtdetrv3_r50vd_6x_container_det
find_unused_parameters: True
log_iter: 50
snapshot_epoch: 1

# RT-DETRv3 O2M branch switches (taken from configs/rtdetrv3/rtdetrv3_r50vd_6x_coco.yml
# top level; these live in the top-level config, NOT in _base_/, so they must be restated).
o2m_branch: True
num_queries_o2m: 450

RTDETRTransformerv3:
  eval_idx: -1
  num_decoder_layers: 6
  # Denoising must be OFF on Paddle 3.x+PIR: get_contrastive_denoising_training_group's
  # paddle.nonzero -> MemoryError: Cannot allocate 13.7EB (same reason the RT-DETR v1
  # baseline was trained with `-o RTDETRTransformer.num_denoising=0`).
  # NOTE: stock RT-DETRv3 code needs a small source patch to tolerate denoising off
  # (ppdet/modeling/transformers/rtdetr_transformerv3.py + heads/detr_head.py), otherwise
  # training crashes on None denoising groups. num_noises / noise queries are NOT the
  # buggy path and stay enabled.
  num_denoising: 0
  num_noise_denoising: 0
  num_noises: 2
  num_noise_queries: [300, 300]

# --- fine-tune schedule (mirrors the RT-DETR-R50vd baseline, scaled to 60 epochs) ---
# Tune epochs/milestones here when needed. Note: the O2M aux head only switches to
# dynamic TaskAligned assignment at epoch `static_assigner_epoch: 30` (from _base_).
epoch: 60
eval_with_loss: True
use_tensorboard: True
tensorboard_log_dir: ../../outputs/wqh/container_det/rtdetrv3_r50vd_6x_container_det/tb
LearningRate:
  base_lr: 0.00005
  schedulers:
  - !PiecewiseDecay
    gamma: 0.1
    milestones: [40, 55]
    use_warmup: true
  - !LinearWarmup
    start_factor: 0.001
    steps: 100

TrainReader:
  # batch 1: RT-DETRv3 trains with 1350 decoder queries (300 main + 2x300 noise + 450 o2m),
  # ~3.4x the RT-DETR v1 baseline; eval_with_loss re-runs a training-mode forward at eval
  # in fp32, so both readers must be batch 1 on a 16GB card. Optional speed-up later:
  # training batch 2 + `--amp` (eval stays 1).
  batch_size: 1
  batch_transforms:
    - BatchRandomResize: {target_size: [480, 512, 544, 576, 608, 640, 640, 640, 672, 704], random_size: True, random_interp: True, keep_ratio: False}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    # retain_origin_box + PadGT are REQUIRED by the RT-DETRv3 O2M aux PP-YOLOE head;
    # do not drop them (unlike the RT-DETR v1 reader).
    - NormalizeBox: {retain_origin_box: True}
    - BboxXYXY2XYWH: {}
    - Permute: {}
    - PadGT: {only_origin_box: True}

EvalReader:
  # batch 1: eval_with_loss re-runs the full training-mode forward (1350 queries, fp32),
  # so eval batch must match the training batch memory budget on a 16GB card.
  batch_size: 1
  collate_batch: false
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
  batch_transforms:
    - NormalizeBox: {}
    - BboxXYXY2XYWH: {}
    - Permute: {}

TestReader:
  batch_size: 1
