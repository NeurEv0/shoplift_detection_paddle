_BASE_: [
  'container_det_detection.yml',
  '../../../../src/PaddleDetection-release-2.9/configs/runtime.yml',
  '../../../../src/PaddleDetection-release-2.9/configs/rtdetr/_base_/optimizer_6x.yml',
  '../../../../src/PaddleDetection-release-2.9/configs/rtdetr/_base_/rtdetr_r50vd.yml',
  '../../../../src/PaddleDetection-release-2.9/configs/rtdetr/_base_/rtdetr_reader.yml',
]

# Project-side container detection baseline:
# COCO-trained RT-DETR-R50 weights -> supermarket container fine-tuning.
pretrain_weights: https://bj.bcebos.com/v1/paddledet/models/rtdetr_r50vd_6x_coco.pdparams
weights: output/rtdetr_r50vd_6x_container_det/model_final
find_unused_parameters: True
log_iter: 50
snapshot_epoch: 1

epoch: 36
LearningRate:
  base_lr: 0.00005
  schedulers:
  - !PiecewiseDecay
    gamma: 0.1
    milestones: [24, 32]
    use_warmup: true
  - !LinearWarmup
    start_factor: 0.001
    steps: 1000

TrainReader:
  batch_size: 2

EvalReader:
  batch_size: 2

TestReader:
  batch_size: 1
