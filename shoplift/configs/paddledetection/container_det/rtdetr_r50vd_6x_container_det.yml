_BASE_: [
  'container_det_detection.yml',
  '../../../../src/PaddleDetection-release-2.9/configs/runtime.yml',
  '../../../../src/PaddleDetection-release-2.9/configs/rtdetr/_base_/optimizer_6x.yml',
  '../../../../src/PaddleDetection-release-2.9/configs/rtdetr/_base_/rtdetr_r50vd.yml',
  '../../../../src/PaddleDetection-release-2.9/configs/rtdetr/_base_/rtdetr_reader.yml',
]

# Project-side container detection baseline:
# COCO-trained RT-DETR-R50 weights -> supermarket container fine-tuning.
pretrain_weights: https://bj.bcebos.com/v1/paddledet/models/rtdetr_r50vd_6x_coco.pdparams
weights: ../../outputs/wqh/container_det/rtdetr_r50vd_6x_container_det/model_final
save_dir: ../../outputs/wqh/container_det/rtdetr_r50vd_6x_container_det
find_unused_parameters: True
log_iter: 50
snapshot_epoch: 1

epoch: 36
eval_with_loss: True
use_tensorboard: True
tensorboard_log_dir: ../../outputs/wqh/container_det/rtdetr_r50vd_6x_container_det/tb
LearningRate:
  base_lr: 0.00005
  schedulers:
  - !PiecewiseDecay
    gamma: 0.1
    milestones: [24, 32]
    use_warmup: true
  - !LinearWarmup
    start_factor: 0.001
    steps: 100

TrainReader:
  batch_size: 4
  batch_transforms:
    - BatchRandomResize: {target_size: [480, 512, 544, 576, 608, 640, 640, 640, 672, 704], random_size: True, random_interp: True, keep_ratio: False}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - NormalizeBox: {}
    - BboxXYXY2XYWH: {}
    - Permute: {}

EvalReader:
  batch_size: 4
  collate_batch: false
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
  batch_transforms:
    - NormalizeBox: {}
    - BboxXYXY2XYWH: {}
    - Permute: {}

TestReader:
  batch_size: 1
