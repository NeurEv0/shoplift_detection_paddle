# Local quality gates for the shoplift-paddle workspace.
# One-time setup per clone:
#   pip install pre-commit
#   pre-commit install
# Refs are pinned; bump deliberately and re-run `pre-commit run --all-files`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # ruff-format intentionally not enabled yet: enabling it would
      # reformat the whole tree in one noisy diff. Run `ruff format` once,
      # commit the result, then add the `ruff-format` hook here.

  # Rolled in manually until the codebase is fully typed:
  #   pre-commit run mypy --hook-stage manual --all-files
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [types-PyYAML]
        stages: [manual]
