[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# mypy is currently run manually (see .pre-commit-config.yaml) while the
# codebase is typed incrementally. Do not enable it as a blocking CI gate yet.

[tool.pytest.ini_options]
testpaths = ["shoplift/tests"]
